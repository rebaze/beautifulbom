name: BeautifulBOM
options:
  bundleIdPrefix: de.rebaze
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  BOMCore:
    path: Packages/BOMCore
targets:
  BeautifulBOM:
    type: application
    platform: macOS
    sources:
      - App
      # Samples on the welcome window: public fixtures only (licences in About).
      - path: Fixtures/public/laravel-7.12.0.cdx-1.4.json
        buildPhase: resources
      - path: Fixtures/public/cern-lhc-vdm-editor.cdx.json
        buildPhase: resources
      - path: Fixtures/rio/bsi-pass.cdx.json
        buildPhase: resources
      - path: Fixtures/aibom/zephyr-7b-beta.reference.aibom.json
        buildPhase: resources
      - path: Fixtures/aibom/zephyr-7b-beta.generated.aibom.json
        buildPhase: resources
    dependencies:
      - package: BOMCore
        product: BOMCore
    info:
      path: build/generated/Info.plist
      properties:
        CFBundleDisplayName: Beautiful BOM
        CFBundleName: Beautiful BOM
        NSHumanReadableCopyright: "© 2026 rebaze"
        CFBundleShortVersionString: "0.1.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleDocumentTypes:
          - CFBundleTypeName: JSON Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.rebaze.beautiful-bom
        PRODUCT_NAME: BeautifulBOM
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "15.0"
